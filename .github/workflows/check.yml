name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: sdk
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: heyl_app
      - run: flutter gen-l10n
        working-directory: heyl_app
      # Preserve upstream source; inherited style warnings do not block candidates.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: heyl_app
      - run: flutter test
        working-directory: heyl_app
      - run: flutter test test/interview/config_test.dart --dart-define=ENV=prod --dart-define=API_BASE_URL=https://invalid.example
        working-directory: heyl_app
      - run: flutter build web --no-web-resources-cdn
        working-directory: heyl_app
